# Model choice and USD prices per million tokens, used for the token-analytics cost estimate only.
#
# Source: Anthropic, "Pricing", https://platform.claude.com/docs/en/about-claude/pricing
# (model pricing table: base input, 5-minute cache writes, cache hits and refreshes, output),
# checked 2026-11-03. The page links to https://claude.com/pricing as the most current source;
# re-check both before quoting a cost figure. First-party Claude API rates; Bedrock and Vertex
# pricing differs. cache_write is the 5-minute write price, which is what shared/llm.py requests.

# Model the Claude extractors use unless AFO_MODEL or `evals/run_all.py --model` says otherwise.
default_model: claude-sonnet-5-5

models:
  claude-sonnet-5-5: {input: 2.0, output: 10.0, cache_read: 0.10, cache_write: 2.50}
  claude-opus-5-5: {input: 4.0, output: 20.0, cache_read: 0.20, cache_write: 5.00}
  # Prompts up to 100,000 tokens; longer prompts are priced higher (0.50 / 2.50 / 0.05 / 0.625).
  claude-haiku-5-5: {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}
  # Used when a log row names a model that is not listed above, so the estimate is never silently zero.
  default: {input: 2.0, output: 10.0, cache_read: 0.10, cache_write: 2.50}
